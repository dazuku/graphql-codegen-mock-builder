name: Publish

# Publishes to npm when a GitHub Release is published.
# Create the release from a tag matching the package version (e.g. v0.1.0).
#
# Authenticates with npm trusted publishing (OIDC): no npm token is stored.
# The trusted publisher on npmjs.com must name this repo and the workflow
# filename `publish.yml`. Provenance is generated automatically.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
